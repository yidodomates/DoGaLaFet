name: Build Minecraft 1.12.2 Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download and Build with Gradle 4.10.3 Manually
        run: |
          wget https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip gradle-4.10.3-bin.zip
          export PATH=$PWD/gradle-4.10.3/bin:$PATH
          gradle build --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modified-mod-jar
          path: build/libs/*.jar
